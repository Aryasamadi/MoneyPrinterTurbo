name: Run MoneyPrinterTurbo

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: moneyprinterturbo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Python
      # ---------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ---------------------------------------------------------
      # 3. System dependencies
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version
          python --version
          pip --version

      # ---------------------------------------------------------
      # 4. Python dependencies
      # ---------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      # ---------------------------------------------------------
      # 5. Restore state from the latest previous run
      # ---------------------------------------------------------
      - name: Restore previous MoneyPrinterTurbo state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/mpt-restore

          echo "Searching for previous completed MoneyPrinterTurbo runs..."

          PREVIOUS_RUN_ID="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "moneyprinter.yml" \
              --branch "${GITHUB_REF_NAME}" \
              --status completed \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId' \
            | grep -v "^${GITHUB_RUN_ID}$" \
            | head -n 1 || true
          )"

          if [ -z "${PREVIOUS_RUN_ID}" ]; then
            echo "No previous completed run found."
            echo "Starting with a clean state."
            exit 0
          fi

          echo "Previous run found: ${PREVIOUS_RUN_ID}"

          if gh run download \
              "${PREVIOUS_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name moneyprinterturbo-state \
              --dir /tmp/mpt-restore; then

            echo "Previous state downloaded successfully."

            cp -a /tmp/mpt-restore/. .

            echo "Previous state restored."

          else

            echo "Previous state artifact was not available."
            echo "Starting with a clean state."

          fi

      # ---------------------------------------------------------
      # 6. Show restored structure
      # ---------------------------------------------------------
      - name: Inspect restored state
        run: |
          echo "Current project state:"
          echo "----------------------"

          if [ -d storage ]; then
            echo "storage/ exists"
          fi

          if [ -d output ]; then
            echo "output/ exists"
          fi

          if [ -d temp ]; then
            echo "temp/ exists"
          fi

          if [ -f config.toml ]; then
            echo "config.toml exists"
          else
            echo "config.toml does not exist yet."
          fi

      # ---------------------------------------------------------
      # 7. Start MoneyPrinterTurbo
      # ---------------------------------------------------------
      - name: Start MoneyPrinterTurbo
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          echo "Starting MoneyPrinterTurbo..."

          python main.py \
            > /tmp/moneyprinterturbo.log 2>&1 &

          echo $! > /tmp/moneyprinterturbo.pid

          echo "MoneyPrinterTurbo PID: $(cat /tmp/moneyprinterturbo.pid)"

      # ---------------------------------------------------------
      # 8. Wait for API
      # ---------------------------------------------------------
      - name: Wait for MoneyPrinterTurbo
        run: |
          set -euo pipefail

          echo "Waiting for MoneyPrinterTurbo API..."

          READY=0

          for i in {1..60}; do

            if curl -fsS \
              http://127.0.0.1:8080/docs \
              >/dev/null 2>&1; then

              echo "MoneyPrinterTurbo API is ready."

              READY=1
              break
            fi

            if ! kill -0 \
              "$(cat /tmp/moneyprinterturbo.pid)" \
              2>/dev/null; then

              echo "MoneyPrinterTurbo stopped during startup."

              echo "---------------- LOG ----------------"
              cat /tmp/moneyprinterturbo.log
              echo "-------------------------------------"

              exit 1
            fi

            echo "Waiting... attempt ${i}/60"

            sleep 2

          done

          if [ "${READY}" -ne 1 ]; then

            echo "MoneyPrinterTurbo did not become ready."

            echo "---------------- LOG ----------------"
            cat /tmp/moneyprinterturbo.log
            echo "-------------------------------------"

            exit 1

          fi

      # ---------------------------------------------------------
      # 9. Keep the runner alive
      # ---------------------------------------------------------
      - name: Keep MoneyPrinterTurbo running
        run: |
          set -euo pipefail

          echo "MoneyPrinterTurbo is running."

          while kill -0 \
            "$(cat /tmp/moneyprinterturbo.pid)" \
            2>/dev/null; do

            sleep 30

          done

          echo "MoneyPrinterTurbo stopped."

          echo "---------------- LOG ----------------"
          cat /tmp/moneyprinterturbo.log
          echo "-------------------------------------"

          exit 1

      # ---------------------------------------------------------
      # 10. Save state
      # ---------------------------------------------------------
      - name: Save MoneyPrinterTurbo state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinterturbo-state
          path: |
            config.toml
            storage/
            output/
            temp/
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true

      # ---------------------------------------------------------
      # 11. Save log
      # ---------------------------------------------------------
      - name: Save MoneyPrinterTurbo log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinterturbo-log-${{ github.run_id }}
          path: /tmp/moneyprinterturbo.log
          if-no-files-found: ignore
          retention-days: 3